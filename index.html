<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterkrachtturbines — Typen in detail</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --water:       #0EA5E9;
    --water-dark:  #0C4A6E;
    --water-light: #E0F2FE;
    --water-mid:   #38BDF8;
    --accent:      #0369A1;
    --success:     #059669;
    --success-bg:  #D1FAE5;
    --warning:     #B45309;
    --warning-bg:  #FEF3C7;
    --danger:      #DC2626;
    --danger-bg:   #FEE2E2;
    --pro:         #7C3AED;
    --pro-bg:      #EDE9FE;
    --bg:          #F0F9FF;
    --surface:     #FFFFFF;
    --surface2:    #F8FAFC;
    --tekst:       #0F172A;
    --tekst-2:     #475569;
    --tekst-3:     #94A3B8;
    --rand:        #E2E8F0;
    --rand-sterk:  #CBD5E1;
    --radius:      10px;
    --schaduw:     0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.05);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--tekst);
    min-height: 100vh;
    padding: 0;
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(150deg, var(--water-dark) 0%, #0369A1 60%, #0891B2 100%);
    color: white;
    padding: 2rem 1.5rem 1.75rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--water-mid), #06B6D4, var(--water-mid));
  }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 0.6rem;
  }
  .header h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 300;
    letter-spacing: -0.3px;
    margin-bottom: 0.3rem;
  }
  .header h1 strong { font-weight: 600; }
  .header p {
    font-size: 13px;
    opacity: 0.65;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── MAIN LAYOUT ── */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2.5rem;
  }

  /* ── KAARTEN RIJ ── */
  .kaarten {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 1.25rem;
  }

  .kaart {
    background: var(--surface);
    border: 1.5px solid var(--rand);
    border-radius: var(--radius);
    padding: 0.85rem 0.75rem;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    text-align: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .kaart:hover {
    border-color: var(--water);
    box-shadow: var(--schaduw);
    transform: translateY(-1px);
  }
  .kaart.actief {
    border-color: var(--accent);
    background: var(--water-light);
    box-shadow: 0 0 0 3px rgba(3,105,161,0.12);
  }
  .kaart-icon { font-size: 24px; margin-bottom: 5px; display: block; }
  .kaart-naam {
    font-size: 12px;
    font-weight: 600;
    color: var(--tekst);
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .kaart-jaar { font-size: 11px; color: var(--tekst-3); }
  .kaart-badge {
    display: inline-block;
    margin-top: 5px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.2px;
  }
  .imp  { background: var(--warning-bg); color: var(--warning); }
  .react{ background: var(--pro-bg);     color: var(--pro); }
  .pot  { background: var(--success-bg); color: var(--success); }

  /* ── DETAIL PANEEL ── */
  .detail {
    background: var(--surface);
    border: 1px solid var(--rand);
    border-radius: 14px;
    box-shadow: var(--schaduw);
    overflow: hidden;
    transition: opacity 0.2s;
  }
  .detail-kop {
    background: linear-gradient(135deg, var(--water-dark), var(--accent));
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .detail-kop-icon { font-size: 2rem; flex-shrink: 0; }
  .detail-kop-naam { font-size: 1.15rem; font-weight: 600; margin-bottom: 2px; }
  .detail-kop-sub { font-size: 12px; opacity: 0.7; }
  .detail-body { padding: 1.25rem 1.5rem; }

  /* AFBEELDING */
  .detail-afbeelding {
    width: 100%;
    height: 220px;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--rand);
  }
  .detail-afbeelding img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .detail-afbeelding.leeg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .detail-afbeelding-icon {
    font-size: 2.5rem;
    opacity: 0.25;
  }
  .detail-afbeelding-tekst {
    font-size: 11px;
    color: var(--tekst-3);
    text-align: center;
    max-width: 260px;
    line-height: 1.6;
  }
  .detail-afbeelding-tekst code {
    font-size: 10px;
    background: var(--rand);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--tekst-2);
  }
  .detail-afbeelding-bron {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,0.45);
    padding: 2px 8px;
    border-radius: 20px;
    backdrop-filter: blur(2px);
  }

  /* MINI-THUMBNAIL OP DE KAARTEN */
  .kaart-thumb {
    width: 100%;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    margin-bottom: 6px;
    display: block;
    background: var(--surface2);
  }

  /* SPECS */
  .specs-rij {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 560px) {
    .specs-rij { grid-template-columns: repeat(2, 1fr); }
  }
  .spec {
    background: var(--surface2);
    border: 1px solid var(--rand);
    border-radius: 8px;
    padding: 9px 12px;
  }
  .spec-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--tekst-3);
    margin-bottom: 3px;
  }
  .spec-val {
    font-size: 13px;
    font-weight: 500;
    color: var(--tekst);
    line-height: 1.4;
  }

  /* STAAFGRAFIEKEN */
  .balken { margin-bottom: 1.25rem; }
  .balk-sectietitel {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--tekst-3);
    margin-bottom: 8px;
  }
  .balk-rij {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
  }
  .balk-label {
    font-size: 12px;
    color: var(--tekst-2);
    width: 110px;
    flex-shrink: 0;
  }
  .balk-track {
    flex: 1;
    height: 7px;
    background: var(--rand);
    border-radius: 4px;
    overflow: hidden;
  }
  .balk-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--water-mid));
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .balk-num {
    font-size: 11px;
    color: var(--tekst-3);
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  /* VOOR / NADELEN */
  .proscongrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 480px) {
    .proscongrid { grid-template-columns: 1fr; }
  }
  .pc-box {
    background: var(--surface2);
    border: 1px solid var(--rand);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .pc-titel {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 7px;
  }
  .pc-titel.pro { color: var(--success); }
  .pc-titel.con { color: var(--danger); }
  .pc-item {
    font-size: 12.5px;
    color: var(--tekst-2);
    line-height: 1.5;
    margin-bottom: 4px;
    padding-left: 13px;
    position: relative;
  }
  .pc-item::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--tekst-3);
  }

  /* TOEPASSINGEN */
  .toepassing-box {
    background: var(--water-light);
    border: 1px solid #BAE6FD;
    border-radius: 8px;
    padding: 10px 14px;
  }
  .toepassing-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .toepassing-tekst {
    font-size: 13px;
    color: var(--water-dark);
    line-height: 1.6;
  }

  /* WERKINGSPRINCIPE */
  .werking-box {
    background: var(--surface2);
    border: 1px solid var(--rand);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 1.25rem;
  }
  .werking-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .werking-item {
    font-size: 13.5px;
    color: var(--tekst-2);
    line-height: 1.6;
    margin-bottom: 4px;
    padding-left: 14px;
    position: relative;
  }
  .werking-item:last-child { margin-bottom: 0; }
  .werking-item::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  /* VERGELIJKING BADGE */
  .best-badge {
    display: inline-block;
    background: var(--success-bg);
    color: var(--success);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* FOOTER */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--tekst-3);
    padding: 1rem;
    border-top: 1px solid var(--rand);
    margin-top: 1rem;
  }

  /* ANIMATIE bij selectie */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .detail-body { animation: fadeIn 0.2s ease; }
</style>
</head>

    ],
    valhoogte: '2 – 40 m',
    debiet: 'Zeer hoog',
    rendement: '90 – 93 %',
    regeling: 'Gidsvanen + rotorbladverstelling (dubbel)',
    druk: 'Ingesloten (overdruk)',
    as: 'Verticale of horizontale Bulb-variant',
    bars: [
      { label: 'Rendement',      val: 93 },
      { label: 'Regelbaarheid',  val: 95 },
      { label: 'Debietgebied',   val: 100 },
      { label: 'Valhoogtegebied',val: 30 },
    ],
    voor: [
      'Beste keuze bij hoog debiet en laag verval',
      'Rendement stabiel over breed debietsgebied',
      'Verstelbare rotorbladen = maximale flexibiliteit',
      'Geschikt voor getijdenstations',
    ],
    nadelen: [
      'Complexe mechaniek (dubbele verstelling)',
      'Hoge constructie- en onderhoudskosten',
      'Groot grond- en betonwerk nodig',
    ],
    toepassingen: 'Riviermond Eems, Maasbracht, Gentbrugge. Getijdecentrale Rance (Frankrijk, 240 MW). Coo-Trois-Ponts (pomp-opslagcentrale). Stroom-Kaplan in bevaarbare waterwegen.',
  },
];

let huidig = 0;

function bouwKaarten() {
  const grid = document.getElementById('kaarten');
  grid.innerHTML = TYPES.map(t => `
    <div class="kaart${t.id === 0 ? ' actief' : ''}" onclick="kiesType(${t.id})" role="button" tabindex="0" aria-label="${t.naam} selecteren">
      <img class="kaart-thumb" src="${t.afbeelding}" alt="" loading="lazy"
           data-icon="${t.icon}" onerror="toonThumbFallback(this)">
      <div class="kaart-naam">${t.naam}</div>
      <div class="kaart-jaar">${t.jaar}</div>
      <span class="kaart-badge ${t.badgeKlasse}">${t.badge}</span>
    </div>`).join('');
}

// Vervangt een gebroken kaart-thumbnail door het emoji-icoon, zodat er nooit
// een 'gebroken beeld'-icoon zichtbaar is zolang de echte foto nog ontbreekt.
function toonThumbFallback(img) {
  const span = document.createElement('span');
  span.className = 'kaart-icon';
  span.textContent = img.dataset.icon;
  img.replaceWith(span);
}

// Vervangt de grote detailbanner door een nette lege placeholder als de
// afbeelding (nog) niet gevonden wordt op het opgegeven pad.
function toonAfbeeldingFallback(img) {
  const container = img.closest('.detail-afbeelding');
  if (!container) return;
  const icon = container.dataset.icon || '';
  const pad = container.dataset.pad || '';
  container.classList.add('leeg');
  container.innerHTML = `
    <span class="detail-afbeelding-icon">${icon}</span>
    <span class="detail-afbeelding-tekst">Nog geen afbeelding gevonden op<br><code>${pad}</code></span>`;
}

function bouwDetail(id) {
  const t = TYPES[id];

  // Bepaal welke bars de hoogste waarde hebben voor een badge
  const maxBars = {};
  ['rendement','regelbaarheid','debietgebied','valhoogtegebied'].forEach((k, i) => {
    const max = Math.max(...TYPES.map(ty => ty.bars[i].val));
    if (t.bars[i].val === max) maxBars[i] = true;
  });

  // Afbeeldingsbanner met fallback: als de afbeelding niet laadt, tonen we
  // een lege placeholder in plaats van een gebroken beeldicoon.
  const bronHTML = t.afbeeldingBron
    ? `<span class="detail-afbeelding-bron">${t.afbeeldingBron}</span>` : '';
  document.getElementById('detail-afbeelding').innerHTML = `
    <div class="detail-afbeelding" id="detail-afbeelding-inner">
      <img src="${t.afbeelding}" alt="${t.naam}" onerror="toonAfbeeldingFallback(this)">
      ${bronHTML}
    </div>`;
  document.getElementById('detail-afbeelding-inner').dataset.icon = t.icon;
  document.getElementById('detail-afbeelding-inner').dataset.pad = t.afbeelding;

  document.getElementById('detail-kop').innerHTML = `
    <div class="detail-kop-icon">${t.icon}</div>
    <div>
      <div class="detail-kop-naam">${t.naam}</div>
      <div class="detail-kop-sub">${t.jaar}</div>
    </div>`;

  const werkingHTML = t.werking.map(w => `<div class="werking-item">${w}</div>`).join('');

  const specsHTML = [
    { label: 'Valhoogte', val: t.valhoogte },
    { label: 'Debiet',    val: t.debiet },
    { label: 'Rendement', val: t.rendement },
    { label: 'Regeling',  val: t.regeling },
  ].map(s => `
    <div class="spec">
      <div class="spec-label">${s.label}</div>
      <div class="spec-val">${s.val}</div>
    </div>`).join('');

  const balkenHTML = t.bars.map((b, i) => `
    <div class="balk-rij">
      <span class="balk-label">${b.label}${maxBars[i] ? '<span class="best-badge">best</span>' : ''}</span>
      <div class="balk-track"><div class="balk-fill" style="width:${b.val}%"></div></div>
      <span class="balk-num">${b.val} %</span>
    </div>`).join('');

  const voorHTML  = t.voor.map(v    => `<div class="pc-item">${v}</div>`).join('');
  const nadelenHTML = t.nadelen.map(n => `<div class="pc-item">${n}</div>`).join('');

  // Vervang de body met animatie
  const body = document.getElementById('detail-body');
  body.style.animation = 'none';
  body.offsetHeight; // reflow
  body.style.animation = '';

  body.innerHTML = `
    <div class="werking-box">
      <div class="werking-label">Werkingsprincipe</div>
      ${werkingHTML}
    </div>

    <div class="specs-rij">${specsHTML}</div>

    <div class="balken">
      <div class="balk-sectietitel">Vergelijkende prestatie-indicatoren</div>
      ${balkenHTML}
    </div>

    <div class="proscongrid">
      <div class="pc-box">
        <div class="pc-titel pro">Voordelen</div>
        ${voorHTML}
      </div>
      <div class="pc-box">
        <div class="pc-titel con">Nadelen</div>
        ${nadelenHTML}
      </div>
    </div>

    <div class="toepassing-box">
      <div class="toepassing-label">Typische toepassingen</div>
      <div class="toepassing-tekst">${t.toepassingen}</div>
    </div>`;
}

function kiesType(id) {
  huidig = id;
  document.querySelectorAll('.kaart').forEach((k, i) => {
    k.classList.toggle('actief', i === id);
  });
  bouwDetail(id);
}

// Toetsenbordondersteuning
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') kiesType((huidig + 1) % TYPES.length);
  if (e.key === 'ArrowLeft')  kiesType((huidig - 1 + TYPES.length) % TYPES.length);
});

// Init
bouwKaarten();
bouwDetail(0);
</script>
</body>
</html>
